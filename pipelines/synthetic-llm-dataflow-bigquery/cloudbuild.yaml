# One image serves both the Flex Template launcher and the GPU workers
# (docker/Dockerfile, ADR 0009). The image records its own pushed URI so the
# launcher can point the worker harness at it (SDFB_SDK_CONTAINER_IMAGE).
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - --platform=linux/amd64
      - -f=docker/Dockerfile
      - -t=${_TAG}
      - --build-arg=SDFB_SDK_CONTAINER_IMAGE_ARG=${_TAG}
      - --build-arg=GIT_COMMIT_ARG=${_GIT_COMMIT}
      - .
images:
  - ${_TAG}
substitutions:
  _TAG: unset
  _GIT_COMMIT: unknown
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_32
  diskSizeGb: 200
timeout: 7200s
